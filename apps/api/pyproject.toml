[project]
name = "killscore"
version = "0.1.0"
description = "Diff-scoped mutation testing release gate"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "pytest>=8.3",
    "coverage>=7.6",
]

[project.scripts]
killscore = "killscore.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["killscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
