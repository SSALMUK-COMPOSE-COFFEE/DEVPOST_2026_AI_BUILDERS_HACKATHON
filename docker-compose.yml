services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: killscore
      POSTGRES_PASSWORD: killscore
      POSTGRES_DB: killscore
    ports:
      - "${DB_PORT:-25432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U killscore"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://killscore:killscore@db:5432/killscore
    ports:
      - "${API_PORT:-8800}:8000"
    volumes:
      - ./demo:/app/demo:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8800}
    env_file: .env
    ports:
      - "${WEB_PORT:-3300}:3000"
    depends_on:
      - api

volumes:
  pgdata:
