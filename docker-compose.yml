services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: killscore
      POSTGRES_PASSWORD: killscore
      POSTGRES_DB: killscore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U killscore"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://killscore:killscore@db:5432/killscore
    ports:
      - "8000:8000"
    volumes:
      - ./demo:/app/demo:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
